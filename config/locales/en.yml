en:
  agreement_engine:
    agreements:
      show:
        title: "%{agreement} Changed"
        last_updated: "Last updated %{date}"
        description: "Before you can proceed, you must read and accept the new %{agreement}."
        accept: "I Accept"
        decline: "I Decline"
        waiting: "You can accept in {seconds} seconds."
        ready: "You can now accept."
      update:
        too_soon: "Read the %{agreement} for at least %{seconds} seconds before accepting."
      destroy:
        declined: "To continue using the service, please sign in and accept the %{agreement}."
    consents:
      show:
        statement: "I have read this disclosure, I can open and keep records as it describes, and I agree to receive and sign records electronically."
        consent: "I Consent"
        held: "You have consented to electronic records. You can withdraw that consent here."
        withdraw: "Withdraw"
      create:
        given: "Your consent to electronic records is recorded."
      destroy:
        withdrawn: "Your consent to electronic records is withdrawn."
    signatures:
      show:
        statement: "By typing your full name and selecting Sign, you sign the %{document} above electronically, and your electronic signature has the same effect as a handwritten one."
        typed_name: "Your full name"
        sign: "Sign"
      update:
        blank: "Type your full name to sign."
        stale: "This document changed while you were reading it. Read the current version below and sign again."
        too_soon: "Read the %{document} for at least %{seconds} seconds before signing."
        signed: "You signed the %{document}."
    record_documents:
      show:
        statement: "By selecting I Accept, you agree to the %{document} above."
        accept: "I Accept"
      update:
        accepted: "You accepted the %{document}."
    receipt_mailer:
      copy:
        subject: "Your copy of the %{document}"
        body: "Attached are your copy of the %{document} and the byte-form file its SHA-256 hash was taken from. Running any SHA-256 tool on that file prints the hash below."
    verifications:
      show:
        title: "Check a signed copy"
        description: "Choose the byte-form file from your copy and enter the SHA-256 hash it shows. Nothing you send is stored."
        file: "Byte-form file"
        hash: "SHA-256 hash"
        check: "Check"
        matched: "The file matches this hash."
        not_matched: "The file does not match this hash."
    documents:
      show:
        none:
          default: "Nothing has been published here yet."
          terms_of_service: "No terms of service have been published yet."
          privacy_policy: "No privacy policy has been published yet."
